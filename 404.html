<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 聆听花瓣雨的故事</title>
    <link rel="icon" type="image/svg+xml" href="./assets/images/favicon.svg" />
    <link rel="shortcut icon" href="./assets/images/favicon.svg" />
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .error-box { max-width: 500px; padding: 40px; }
        .error-box h1 { font-size: 80px; margin: 0; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .error-box p { font-size: 18px; color: #666; margin: 20px 0; }
        .error-box a { display: inline-block; padding: 10px 30px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; text-decoration: none; border-radius: 25px; }
    </style>
</head>
<body>
    <div class="error-box">
        <h1>404</h1>
        <p>页面未找到</p>
        <a href="/">返回首页</a>
    </div>
</body>
</html>
